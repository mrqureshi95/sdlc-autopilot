name: Validate package and evidence helpers
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Runtime and harness regressions
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -q
      - name: Package and docs
        run: node --test scripts/verify-pipeline.test.mjs docs/sdlc-autopilot-spec.test.mjs scripts/skill-package.test.mjs
      - name: Controlled verifier comparison
        run: python3 scripts/compare-verifiers.py
      - name: Structural evaluation validation
        run: sh scripts/run-evals.sh
      - name: Shell and Python syntax
        run: |
          for script in scripts/*.sh skills/sdlc-autopilot/scripts/*.sh; do sh -n "$script"; done
          python3 -m compileall -q scripts skills/sdlc-autopilot/scripts evals/oracles
      - name: Prepare pinned evaluation runtime
        run: python3 scripts/prepare-eval-runtime.py --output "$RUNNER_TEMP/sdlc-runtime"
      - name: Validation dependency advisories
        working-directory: evals/runtime
        run: npm audit --audit-level=moderate
      - name: Baseline fixtures and semantic controls
        run: |
          python3 scripts/check-fixtures.py --runtime-dir "$RUNNER_TEMP/sdlc-runtime"
          python3 scripts/check-oracles.py --runtime-dir "$RUNNER_TEMP/sdlc-runtime"
      - name: Native runner and standalone installer controls
        run: |
          python3 scripts/check-runner-adapters.py --runtime-dir "$RUNNER_TEMP/sdlc-runtime"
          python3 scripts/check-installation.py --runtime-dir "$RUNNER_TEMP/sdlc-runtime"
      - name: Prepare maintained secret scanner
        run: python3 scripts/prepare-security-tool.py --output "$RUNNER_TEMP/sdlc-security"
      - name: Secret scanner controls and repository scan
        run: |
          python3 scripts/check-security-tool.py --binary "$RUNNER_TEMP/sdlc-security/gitleaks"
          "$RUNNER_TEMP/sdlc-security/gitleaks" dir . --redact --no-banner --ignore-gitleaks-allow
